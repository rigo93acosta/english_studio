[project]
name = "whistle-voz"
version = "0.1.0"
description = "App web local para practicar inglés con Kokoro y Whistle"
readme = "README.md"
authors = [
    { name = "riacosta", email = "rigo93acosta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cactus-needle>=3.2.8",
    "fastapi>=0.162.0",
    "kokoro-onnx>=0.6.1",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
whistle-web = "whistle_voz.web:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
